<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes 💌</title>
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/transition.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="floating-hearts">
        <span>❤️</span><span>💖</span><span>🌸</span><span>✨</span><span>💕</span><span>💗</span>
    </div>

    <div class="wrapper">
        <header class="glass-nav">
            <div class="logo">Kiersty Hub</div>
            <nav>
                <a href="home.html">Home</a>
                <a href="time.html">Our Time</a>
                <a href="memories.html">Memories</a>
                <a href="notes.html" class="active">Notes</a>
            </nav>
        </header>

<section class="letters-section">
            <h2>Open When... 💌</h2>
            <p class="section-subtitle">Tap a card whenever you need a reminder of how much I love you.</p>
            
            <div class="letters-grid">
                <div class="letter-card" onclick="openEnvelope('miss-you')">
                    <div class="card-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
                    <h3>You miss me</h3>
                    <p class="card-status"><i class="fa-solid fa-envelope-open"></i> Click to open</p>
                </div>
                <div class="letter-card" onclick="openEnvelope('stressed')">
                    <div class="card-icon"><i class="fa-solid fa-mug-hot"></i></div>
                    <h3>You are stressed</h3>
                    <p class="card-status"><i class="fa-solid fa-envelope-open"></i> Click to open</p>
                </div>
                <div class="letter-card" onclick="openEnvelope('need-smile')">
                    <div class="card-icon"><i class="fa-solid fa-gem"></i></div>
                    <h3>You need a smile</h3>
                    <p class="card-status"><i class="fa-solid fa-envelope-open"></i> Click to open</p>
                </div>
            </div>
        </section>

        <footer>
        </footer>
    </div>

    <div id="envelopeModal" class="envelope-modal">
        <div class="modal-backdrop" onclick="closeEnvelope()"></div>
        
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope">
                <div class="flap top-flap"></div>
                <div class="pocket"></div>
                <div class="letter-paper" id="letterPaper">
                    <button class="close-card-btn" onclick="closeEnvelope()">&times;</button>
                    <h3 id="letterTitle">Letter Title</h3>
                    <div class="letter-body" id="letterBody">Letter content goes here...</div>
                    
                    <div class="reaction-container">
                        <span>How did this make you feel?</span>
                        <div class="reactions">
                            <button class="react-btn" onclick="reactToLetter('❤️')">❤️</button>
                            <button class="react-btn" onclick="reactToLetter('👍')">👍</button>
                            <button class="react-btn" onclick="reactToLetter('👎')">👎</button>
                        </div>
                        <p id="reactionFeedback" class="reaction-feedback"></p>
                    </div>

                    <div class="reply-container">
                        <textarea id="replyInput" placeholder="Write a reply back to him... ✍️"></textarea>
                        <button class="send-reply-btn" onclick="sendReply()">Send Reply 💕</button>
                        <p id="replyStatus" class="reply-status"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/notes.js"></script>
</body>
</html>
