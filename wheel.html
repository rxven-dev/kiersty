<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Night Spinner 🎯</title>
    <link rel="stylesheet" href="css/wheel.css">
    <link rel="stylesheet" href="css/transition.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="floating-hearts">
        <span>❤️</span><span>💖</span><span>🌸</span><span>✨</span><span>💕</span><span>💗</span>
    </div>

    <div class="wrapper">
<header class="glass-nav">
    <div class="logo">Kiersty Hub</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="time.html">Our Time</a>
        <a href="memories.html">Memories</a>
        <a href="notes.html">Letter</a>
        <a href="jar.html">Jar</a>
        <a href="wheel.html" class="active">Wheel</a>
    </nav>
</header>

        <section class="wheel-section">
            <h2>Date Night Spinner 🎯</h2>
            <p class="subtitle">Can't decide what to do? Let the wheel pick our date idea! 💕</p>

            <div class="wheel-wrapper">
                <div class="wheel-pointer">▼</div>
                <div class="wheel-container">
                    <canvas id="wheelCanvas" width="360" height="360"></canvas>
                </div>
            </div>

            <button id="spinBtn" class="spin-btn" onclick="spinWheel()">Spin the Wheel! 🚀</button>

            <div class="result-box" id="resultBox">
                <h3>Our Date Idea:</h3>
                <p id="resultText">Spin to find out! ✨</p>
            </div>
        </section>

        <footer>
            <p></p>
        </footer>
    </div>

    <script>
        const options = [
            { label: "🍕 Pizza & Movie", color: "#ff8fa3" },
            { label: "☕ Try a New Cafe", color: "#ffb3c1" },
            { label: "🍦 Late Night Ice Cream", color: "#ffccd5" },
            { label: "🛋️ Call & Play Games", color: "#ff758f" },
            { label: "🌅 Watch Sunset", color: "#ff4d6d" },
            { label: "🍔 Fast Food Craving", color: "#c77dff" },
            { label: "🍿 Cinema Date Night", color: "#e0aaff" },
            { label: "🎧 Listen Music Together", color: "#ffb703" }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numOptions = options.length;
        const arcSize = (2 * Math.PI) / numOptions;
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numOptions; i++) {
                const angle = currentAngle + i * arcSize;
                
                // Sector
                ctx.beginPath();
                ctx.fillStyle = options[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Text Label
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Outfit, sans-serif';
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillText(options[i].label, radius - 15, 5);
                ctx.restore();
            }

            // Center Pin Circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#ff4d6d';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            document.getElementById('resultText').innerText = "Spinning... 🎲";

            const extraRotations = (Math.floor(Math.random() * 5) + 5) * 360;
            const randomDegree = Math.floor(Math.random() * 360);
            const totalRotationDegrees = extraRotations + randomDegree;
            
            const duration = 4000;
            const startTimestamp = performance.now();
            const startAngle = currentAngle;

            function animateWheel(now) {
                const elapsed = now - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease Out Quad
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                const degreesToRadians = (deg) => (deg * Math.PI) / 180;
                currentAngle = startAngle + degreesToRadians(totalRotationDegrees) * easeOut;

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    
                    // Calculate Selected Slice
                    const normalizedDegrees = (360 - ((currentAngle * 180 / Math.PI) % 360) + 270) % 360;
                    const winningIndex = Math.floor(normalizedDegrees / (360 / numOptions)) % numOptions;
                    
                    const winningOption = options[winningIndex].label;
                    document.getElementById('resultText').innerText = winningOption + " 💕";

                    // Trigger Confetti Celebration
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 80,
                            spread: 60,
                            origin: { y: 0.7 }
                        });
                    }
                }
            }

            requestAnimationFrame(animateWheel);
        }
    </script>
</body>
</html>
