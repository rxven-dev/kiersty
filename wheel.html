<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Night Spinner 🎯</title>
    <link rel="stylesheet" href="css/wheel.css">
    <link rel="stylesheet" href="css/transition.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="floating-hearts">
        <span>❤️</span><span>💖</span><span>🌸</span><span>✨</span><span>💕</span><span>💗</span>
    </div>

    <div class="wrapper">
        <header class="glass-nav">
            <div class="logo">Kiersty Hub</div>
            <nav>
                <a href="home.html">Home</a>
                <a href="time.html">Our Time</a>
                <a href="memories.html">Memories</a>
                <a href="notes.html">Letter</a>
                <a href="jar.html">Jar</a>
                <a href="wheel.html" class="active">Wheel</a>
            </nav>
        </header>

        <section class="wheel-section">
            <div class="section-header">
                <h2>Date Night Wheel 🎯</h2>
                <p>Can't decide what to do? Let the wheel pick for us!</p>
            </div>

            <div class="presets-bar">
                <button class="preset-btn active" onclick="loadCategory('food')">🍕 Food & Drinks</button>
                <button class="preset-btn" onclick="loadCategory('activities')">🎬 Activities</button>
                <button class="preset-btn" onclick="loadCategory('cozy')">🏠 Cozy At-Home</button>
            </div>

            <div class="wheel-container">
                <div class="pointer">▼</div>
                <canvas id="wheelCanvas" width="380" height="380"></canvas>
            </div>

            <button id="spinBtn" class="spin-btn" onclick="spinWheel()">Spin the Wheel! 💖</button>

            <div class="custom-options glass-card">
                <h3>Customize Slices ✍️</h3>
                <div class="input-group">
                    <input type="text" id="customInput" placeholder="Add custom idea...">
                    <button onclick="addCustomOption()">Add</button>
                </div>
                <div id="optionsTags" class="options-tags"></div>
            </div>
        </section>

        <footer>
            <p>Made with all my love 💕</p>
        </footer>
    </div>

    <div id="resultModal" class="result-modal">
        <div class="modal-backdrop" onclick="closeResultModal()"></div>
        <div class="result-card glass-card">
            <span class="celebrate-icon">🎉</span>
            <h3>Tonight's Winner!</h3>
            <p id="winnerResult">Winner Name</p>
            <button class="btn primary-btn" onclick="closeResultModal()">Let's Do It! 💕</button>
        </div>
    </div>

    <script>
        const categories = {
            food: ["Pizza & Movies 🍕", "Ice Cream Date 🍦", "Cook Dinner Together 🍝", "Sushi Night 🍣", "Coffee Date ☕"],
            activities: ["Arcade Night 🕹️", "Late Night Drive 🚘", "Stargazing 🌟", "Picnic in Park 🧺", "Bowling 🎳"],
            cozy: ["Fort Building ⛺", "Board Games 🎲", "Bake Cookies 🍪", "Spa Night 🧖‍♀️", "Cuddle & Chat 🛋️"]
        };

        let currentOptions = [...categories.food];
        const colors = ["#ff6584", "#ff8fa3", "#ffb3c1", "#ffccd5", "#ff4d6d", "#c77dff"];
        let currentAngle = 0;
        let isSpinning = false;

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");

        function drawWheel() {
            const numOptions = currentOptions.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            currentOptions.forEach((option, i) => {
                const angle = currentAngle + i * arcSize;
                
                // Draw slice
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 10, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px Outfit";
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillText(option, radius - 25, 5);
                ctx.restore();
            });
        }

        function loadCategory(cat) {
            if (isSpinning) return;
            currentOptions = [...categories[cat]];
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTags();
            drawWheel();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const spinAngle = Math.random() * 1000 + 2000;
            const duration = 4000;
            const start = performance.now();

            function animate(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);

                currentAngle = (easeOut * spinAngle * Math.PI) / 180;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    calculateWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function calculateWinner() {
            const numOptions = currentOptions.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI)) + Math.PI / 2) % (2 * Math.PI);
            const winningIndex = Math.floor(normalizedAngle / arcSize) % numOptions;

            const winner = currentOptions[winningIndex];
            document.getElementById('winnerResult').innerText = winner;

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            document.getElementById('resultModal').classList.add('active');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        function addCustomOption() {
            const input = document.getElementById('customInput');
            if (input.value.trim() !== '') {
                currentOptions.push(input.value.trim());
                input.value = '';
                renderTags();
                drawWheel();
            }
        }

        function removeOption(index) {
            if (currentOptions.length <= 2) return;
            currentOptions.splice(index, 1);
            renderTags();
            drawWheel();
        }

        function renderTags() {
            const tagsContainer = document.getElementById('optionsTags');
            tagsContainer.innerHTML = currentOptions.map((opt, i) => `
                <span class="tag">${opt} <i class="fa-solid fa-xmark" onclick="removeOption(${i})"></i></span>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTags();
            drawWheel();
        });
    </script>
</body>
</html>
