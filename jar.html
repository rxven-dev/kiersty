<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reasons Why I Love You 🫙</title>
    <link rel="stylesheet" href="css/jar.css">
    <link rel="stylesheet" href="css/transition.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="floating-hearts">
        <span>❤️</span><span>💖</span><span>🌸</span><span>✨</span><span>💕</span><span>💗</span>
    </div>

    <div class="wrapper">
        <header class="glass-nav">
            <div class="logo">Kiersty Hub</div>
            <nav>
                <a href="home.html">Home</a>
                <a href="time.html">Our Time</a>
                <a href="memories.html">Memories</a>
                <a href="notes.html">Letter</a>
                <a href="jar.html" class="active">Jar</a>
                <a href="wheel.html">Wheel</a>
            </nav>
        </header>

        <section class="jar-section">
            <div class="section-header">
                <h2>Jar of 100 Reasons 💕</h2>
                <p>Tap the jar to pull out a secret note written for you!</p>
            </div>

            <div class="jar-wrapper" onclick="pickReason()">
                <div class="jar-lid"></div>
                <div class="jar-neck"></div>
                <div class="jar-body" id="jarContainer">
                    <div class="jar-notes-inside">
                        <span class="paper-note n1">💌</span>
                        <span class="paper-note n2">🌸</span>
                        <span class="paper-note n3">💕</span>
                        <span class="paper-note n4">✨</span>
                        <span class="paper-note n5">💗</span>
                        <span class="paper-note n6">💖</span>
                    </div>
                    <div class="jar-tag">
                        <span>Pick Me! 🫙</span>
                    </div>
                </div>
            </div>

            <div class="favorites-section glass-card">
                <h3>Your Favorite Notes ⭐</h3>
                <div id="favoritesList" class="favorites-list">
                    <p class="empty-favs">No saved favorites yet! Click the ⭐ on a note to bookmark it.</p>
                </div>
            </div>
        </section>

        <footer>
            <p>Made with all my love 💕</p>
        </footer>
    </div>

    <div id="noteModal" class="note-modal">
        <div class="modal-backdrop" onclick="closeNoteModal()"></div>
        <div class="note-card glass-card">
            <button class="close-btn" onclick="closeNoteModal()">&times;</button>
            <div class="heart-stamp">💌</div>
            <div class="note-content" id="noteContent">Reason loading...</div>
            <div class="modal-actions">
                <button class="fav-btn" id="favBtn" onclick="toggleFavorite()"><i class="fa-regular fa-star"></i> Save to Favorites</button>
                <button class="another-btn" onclick="pickReason()">Pick Another 🫙</button>
            </div>
        </div>
    </div>

    <script>
        const reasons = [
            "Reason #1: Your adorable smile that brightens up my worst days.",
            "Reason #2: How you always listen when I need someone to talk to.",
            "Reason #3: The cute laugh you make when you find something really funny.",
            "Reason #4: Your kind heart and how deeply you care for people.",
            "Reason #5: How safe and peaceful I feel whenever I talk to you.",
            "Reason #6: Your sweet random messages that make my day.",
            "Reason #7: The unique and beautiful way your mind works.",
            "Reason #8: How ridiculously cute you look when you're sleepy.",
            "Reason #9: The way you encourage me to be my best self.",
            "Reason #10: Your patience with me even when I'm being silly.",
            "Reason #11: The warmth in your voice when you say my name.",
            "Reason #12: How effortlessly you make me smile.",
            "Reason #13: Simply because you are YOU, my babyy 💕"
        ];

        let currentReason = "";

        function pickReason() {
            const jar = document.getElementById('jarContainer');
            jar.classList.add('shake');

            // Trigger confetti
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { y: 0.6 },
                colors: ['#ff6584', '#ffb3c1', '#ffffff']
            });

            setTimeout(() => {
                jar.classList.remove('shake');
                const randomIndex = Math.floor(Math.random() * reasons.length);
                currentReason = reasons[randomIndex];
                
                document.getElementById('noteContent').innerText = currentReason;
                updateFavButtonState();
                document.getElementById('noteModal').classList.add('active');
            }, 400);
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.remove('active');
        }

        // Favorites functionality
        function toggleFavorite() {
            let favs = JSON.parse(localStorage.getItem('fav_reasons') || '[]');
            const index = favs.indexOf(currentReason);

            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push(currentReason);
            }

            localStorage.setItem('fav_reasons', JSON.stringify(favs));
            updateFavButtonState();
            renderFavorites();
        }

        function updateFavButtonState() {
            const favs = JSON.parse(localStorage.getItem('fav_reasons') || '[]');
            const btn = document.getElementById('favBtn');
            if (favs.includes(currentReason)) {
                btn.innerHTML = `<i class="fa-solid fa-star" style="color: #ffb703;"></i> Bookmarked`;
            } else {
                btn.innerHTML = `<i class="fa-regular fa-star"></i> Save to Favorites`;
            }
        }

        function renderFavorites() {
            const favs = JSON.parse(localStorage.getItem('fav_reasons') || '[]');
            const container = document.getElementById('favoritesList');
            
            if (favs.length === 0) {
                container.innerHTML = `<p class="empty-favs">No saved favorites yet! Click the ⭐ on a note to bookmark it.</p>`;
                return;
            }

            container.innerHTML = favs.map(f => `
                <div class="fav-item">
                    <span>${f}</span>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderFavorites);
    </script>
</body>
</html>
