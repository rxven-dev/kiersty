    <div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox(event)">
        <span class="close-lightbox">&times;</span>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Enlarged Memory">
            <p id="lightboxCaption"></p>
        </div>
    </div>

    <script>
        let currentCategory = 'all';

        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            const caption = element.getAttribute('data-title') || '';
            
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxCaption').textContent = caption;
            document.getElementById('lightboxModal').classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.classList.contains('lightbox-modal') || 
                event.target.classList.contains('close-lightbox')) {
                document.getElementById('lightboxModal').classList.remove('active');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('lightboxModal').classList.remove('active');
            }
        });

        function setCategory(category, button) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            filterMemories();
        }

        function filterMemories() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            const marqueeWrapper = document.getElementById('marqueeWrapper');
            const filteredGrid = document.getElementById('filteredGrid');

            if (currentCategory === 'all' && searchValue === '') {
                marqueeWrapper.style.display = 'flex';
                filteredGrid.style.display = 'none';
                filteredGrid.innerHTML = '';
                return;
            }

            marqueeWrapper.style.display = 'none';
            filteredGrid.style.display = 'grid';
            filteredGrid.innerHTML = '';

            const allItems = marqueeWrapper.querySelectorAll('.marquee-track .gallery-item');
            const uniqueMap = new Map();

            allItems.forEach(item => {
                const title = item.getAttribute('data-title').toLowerCase();
                const category = item.getAttribute('data-category').toLowerCase();
                const imgSrc = item.querySelector('img').src;

                const matchesCategory = (currentCategory === 'all' || category === currentCategory);
                const matchesSearch = title.includes(searchValue) || category.includes(searchValue);

                if (matchesCategory && matchesSearch && !uniqueMap.has(imgSrc)) {
                    uniqueMap.set(imgSrc, item);
                }
            });

            if (uniqueMap.size === 0) {
                filteredGrid.innerHTML = `<p class="no-results">No photos found matching your search. 🌸</p>`;
            } else {
                uniqueMap.forEach((item) => {
                    const clone = item.cloneNode(true);
                    clone.onclick = function() { openLightbox(this); };
                    filteredGrid.appendChild(clone);
                });
            }
        }
    </script>
